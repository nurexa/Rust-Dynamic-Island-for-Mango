# Test config: same look-affecting settings as the live one.
monitor_rule=name:^HEADLESS-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
border_px=2
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=12
gap_outer_vertical=12
border_radius=12
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=14
shadows_blur=14
shadows_color=0x00000066
animations=1
layer_animations=1
layer_animation_type_open=slide
layer_animation_type_close=slide
tag_num=10
root_color=0x2a4a5aff
layer_rule=no_animation:1,no_shadow:1,layer_name:island
