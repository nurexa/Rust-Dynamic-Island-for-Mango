# Copy to ~/.config/island/config.toml. Every key is optional; these are the
# defaults. Run `island reload` after editing. MODDING.md explains the rest.

# pill, frame, notch, bar, glass, split or minimal. `island style <name>` switches live and
# holds until this line changes. Only frame, bar and glass take space from your windows.
style = "pill"
font = "Adwaita Sans"
icon_font = "JetBrainsMono Nerd Font Propo"   # for app glyphs: any Nerd Font; big ones cost real memory
icon_style = "glyph"              # "glyph" is two-tone, "color" uses each app's own icon
clock = "%I:%M %p"                # strftime
palette = "~/.config/theme/generated/colors.toml"
terminal = "kitty"                # for apps that need one
screenshot_dir = "~/Pictures"
web_search = "https://duckduckgo.com/?q={}"   # the search's last row; empty hides it

# Every part is optional: leave a name out and it's gone. The panel is a grid of tiles:
# small ones (clock, calendar, stats, weather, about) share a row in the order given,
# a tile with nothing to show gives its room to its neighbours. Just "header" and
# "audio" make the lightest panel.
pill = ["media", "workspaces", "claude", "timer", "network", "privacy", "battery", "clock"]
panel = ["header", "clock", "calendar", "stats", "weather", "about", "media", "timer", "notifications", "audio", "brightness", "nightlight", "status", "bluetooth"]
tools = ["apps", "run", "windows", "files", "clipboard", "screenshot", "wifi", "bluetooth", "wallpaper", "power"]
sidebar = ["media", "calendar", "controls", "notifications"]   # [] leaves it out
visualizer = ["bars", "wave", "ring"]   # run only while music plays and one is on screen; [] is off
notifications = true              # false keeps your own notification daemon
disable = []                      # parts to leave out wherever they appear; `island settings` lists every one, `island preset light` keeps the basics

[ui]
# Settings (`island settings`) changes these, and everything else here, live.
solid_icons = true                # false: outlines, solid only for what is on
scale = 1.0                       # 0.75 to 2: the size of all of it
blur = "auto"                     # "on", "off", or "auto" for the glass style. The compositor does the blurring: see README
# opacity = 0.8                   # 0.3 to 1; unset is the style's own
hover_open = true                 # false: the panel opens only on click or the pin key
hover_open_ms = 130               # delay before hover opens it
hover_close_ms = 280              # delay before leaving closes it
hover_sidebar = true              # resting on the middle of the frame's right border opens the sidebar

[calendar]
dir = ""                          # a folder of .ics files (vdirsyncer's, or exports) for dots and what's next; never the network
week_start = "sunday"             # or "monday", "saturday"

[weather]                         # the weather tile; needs curl, asks open-meteo.com (no key)
location = ""                     # "52.52,13.40" or a place name like "Berlin"; empty turns weather off
units = "metric"                  # or "imperial"
interval = 30                     # minutes between updates

# Palette keys. A list replaces the default, [] turns the action off.
# Chords: ctrl+ alt+ shift+ then a letter or enter, escape, tab, space, backspace,
# up, down, pageup, pagedown. Modifiers must match exactly. Typing and plain
# Backspace are fixed.
[keys]
up = ["up", "ctrl+p", "ctrl+k"]
down = ["down", "ctrl+n", "ctrl+j"]
page_up = ["pageup"]
page_down = ["pagedown"]
accept = ["enter", "kp_enter"]
close = ["escape"]                # steps back out of a sub-list first
next_tool = ["tab"]
prev_tool = ["shift+tab"]
clear = ["ctrl+u"]
delete_word = ["ctrl+w", "ctrl+backspace"]

[nightlight]                      # warms and dims the screen through wlr-gamma-control; no wlsunset needed
schedule = ""                     # "20:00-07:00" turns it on and off; a manual toggle holds until the next edge
warmth = 3400                     # Kelvin, 2500-6500; the panel slider's choice is remembered after that
dim = 0.85                        # brightness while on, 0.2-1

[pomodoro]                        # minutes
focus = 25
short = 5
long = 15
rounds = 4                        # focus rounds before the long break
auto = true                       # start the next phase on its own

[claude]                          # needs its hooks: island claude-setup
approve = true                    # permission prompts become cards when you're not at that terminal
notify = true                     # a note when a session finishes or needs you

[notify]                          # seconds on screen; critical stays until dismissed
low = 3
normal = 5

[icons]
# App id = a glyph, or the name of one of the island's own icons (src/symbols.rs).
# Added to the built-in table in src/pen.rs.
# "org.gnome.nautilus" = "󰉋"

[commands]
wifi = "nm-connection-editor"     # left click on the network label, without the wifi tool
wifi_alt = ""                     # right click
mixer = "pavucontrol"             # right click on the volume controls
lock = "loginctl lock-session"    # the power tool's Lock
wallpaper_pick = ""               # the panel's wallpaper button, without the wallpaper tool
wallpaper_next = ""               # right click on it
wallpaper_toggle = ""             # middle click on it
wallpaper_opt = ""                # "wall opt" adds fit, speed, fps and quality to the wallpaper picker
brightness_get = ""               # prints 0-100; empty reads /sys/class/backlight (no backlight, no slider)
brightness_set = ""               # {} is the percentage; empty uses brightnessctl. DDC: "ddcutil setvcp 10 {}"

[wallpaper]
dir = ""                          # folder to list; empty hides the wallpaper tool
thumb = ""                        # thumbnail path, with {file} as the file's name
set = ""                          # runs on choosing one, with {path} as the file
# Read by `wall` (wall/wall), the engine behind wallpaper_opt:
size = ""                         # "2560x1440" to override the monitor size it detects
on_change = ""                    # shell command on each new wallpaper; {image} is a full-size still

# A palette tool made of two commands. Add its name to `tools`.
# [[tool]]
# name = "projects"
# glyph = "folder"                # an icon's name from src/symbols.rs, or any glyph
# list = "ls ~/Projects"
# run = "kitty -d ~/Projects/{}"

# A pill or panel module made of a command. Place it with "custom:weather".
# [[custom]]
# name = "weather"
# exec = "curl -s 'wttr.in/?format=%t'"
# interval = 600
# on_click = "xdg-open https://wttr.in"
