[package]
name = "island"
version = "0.1.0"
edition = "2024"
description = "Apple-style Dynamic Island for MangoWC: replaces Waybar"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
cairo-rs = { version = "0.22", default-features = false, features = ["png"] }
pango = { version = "0.22", features = ["v1_50"] }
pangocairo = "0.22"
resvg = { version = "0.49", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"
libc = "0.2"
zune-jpeg = "0.5"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
